<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CursorForce</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="app" id="app">

    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 3L19 12L12 13.5L9.5 21L5 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <circle cx="19" cy="19" r="3" fill="currentColor" opacity="0.5"/>
        </svg>
        <span class="logo-text">CursorForce</span>
      </div>
      <button class="theme-btn" id="themeBtn" title="テーマ切替">
        <svg id="themeIconDark" viewBox="0 0 24 24" fill="none">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg id="themeIconLight" viewBox="0 0 24 24" fill="none" style="display:none">
          <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/>
          <line x1="12" y1="1" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="12" y1="21" x2="12" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="1" y1="12" x2="3" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="21" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <!-- Global toggle -->
    <section class="section main-toggle-section">
      <div class="toggle-row">
        <div class="toggle-info">
          <span class="toggle-label">カーソル強制表示</span>
          <span class="toggle-desc" id="globalDesc">すべてのサイトで有効</span>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="globalToggle">
          <span class="slider"></span>
        </label>
      </div>

      <div class="shortcut-badge">
        <svg viewBox="0 0 24 24" fill="none" class="shortcut-icon">
          <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/>
          <path d="M7 9h2M7 12h2M7 15h2M11 9h6M11 12h3M11 15h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span id="shortcutText">Alt+Shift+C</span>
        <span class="shortcut-hint">でも切替可能</span>
      </div>
    </section>

    <!-- Current site -->
    <section class="section" id="siteSection">
      <div class="section-header">
        <svg viewBox="0 0 24 24" fill="none" class="section-icon">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
          <path d="M12 3c-2 3-3 5.5-3 9s1 6 3 9M12 3c2 3 3 5.5 3 9s-1 6-3 9M3 12h18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <span class="section-title">現在のサイト</span>
      </div>

      <div class="site-card">
        <div class="site-favicon" id="siteFavicon">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </div>
        <div class="site-info">
          <span class="site-hostname" id="siteHostname">読み込み中...</span>
          <span class="site-status" id="siteStatus"></span>
        </div>
        <button class="site-toggle-btn" id="siteToggleBtn"></button>
      </div>
    </section>

    <!-- Disabled sites list -->
    <section class="section" id="disabledSection">
      <div class="section-header">
        <svg viewBox="0 0 24 24" fill="none" class="section-icon">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="section-title">常にオフのサイト</span>
        <span class="site-count" id="siteCount">0</span>
      </div>
      <div class="disabled-list" id="disabledList">
        <div class="empty-state" id="emptyState">
          <span>除外サイトなし</span>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <span>v1.0.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
